[project]
name = "agentic-scripts"
version = "0.1.0"
description = "Load-aware agentic workflow scheduler: timer-driven, gate-gated, idempotent workflows with durable per-workflow state."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "psutil>=5",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

# NOTE (load-bearing): the console-script entry point is declared here in Task 1,
# but `agentic_scripts.cli:main` does not exist until Task 2 lands. This is safe:
# `uv sync` only records entry-point metadata and does not import the target module,
# so installation succeeds without `cli.py`. The command fails at *invocation* time
# (import error) until Task 2 provides it. Declaring it early keeps this pyproject
# final — Tasks 2–5 must NOT modify pyproject.toml (parallel-safety).
[project.scripts]
agentic-scripts = "agentic_scripts.cli:main"
mail-search = "agentic_scripts.mail.mail_search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
