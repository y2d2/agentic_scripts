# agentic_scripts configuration
machine:
  quiet_window:
    start: "22:00"   # local time, HH:MM; window crosses midnight (start > end)
    end: "08:00"
  load_threshold: 32.0         # load1 must be STRICTLY below this (88-core box; ~36% of cores — user's explicit overnight-grind choice)
  poll_interval_minutes: 30    # nominal timer cadence
  gate_polls_required: 2       # consecutive idle polls needed to open the gate; allowed: 1 or 2
  gate_poll_tolerance_minutes: 10  # max gap between consecutive idle polls
agent:
  binary: opencode
  model: llama-cpp/Qwen3.8-27B   # string or null; null = agent's own frontmatter model
  max_steps: 80            # informational; mirrors the agent frontmatter `steps` (raised 40→80, user-approved 2026-10-25)
  timeout_minutes: 180     # per-workflow hard timeout for the agent run (local Qwen3.8-27B runs 47–140 min depending on host load)
  auto_approve: true       # pass --auto to opencode run
paths:
  state_dir: state         # relative paths resolve against the project root
  log_dir: logs
  sandbox_dir: sandbox
admin_repo: /workspace/Obsidian/ARP_roadmap   # string or null
oc_todo:
  repos: []                  # GitHub repos to scan ("owner/name"); empty = no-op scan
  max_todos_per_repo: 3      # max todos processed per repo per run
  test_commands: {}          # optional per-repo test command, e.g. { "owner/name": "uv run pytest" }
  repo_urls: {}              # optional clone-URL overrides per repo (local fixtures / mirrors)
roadmap_prompts:
  allowed_repos: []          # GitHub repos to scan for un-archived plans ("owner/name"); empty = no-op
  listing_repo: y2d2/ARP_prompts   # live plan listing repo ("owner/name")
  listing_repo_url: ""       # clone-URL override; "" = derived git@github.com:<listing_repo>.git
  listing_path: plans.md     # listing file inside the listing repo
  listing_branch: main       # branch holding the listing
  run_timeout_minutes: 480   # per-job hard timeout for an execution run
  test_commands: {}          # optional per-repo test command (keys must be in allowed_repos)
  repo_urls: {}              # optional per-repo clone-URL overrides (local fixtures / mirrors)
workflows:
  noop:
    enabled: true
    module: agentic_scripts.workflows.noop
    agent: null            # string or null; set for workflows that spawn an agent
  mail-keeper:
    enabled: true
    module: agentic_scripts.workflows.mail_keeper
    agent: mail-keeper
  oc-todo:
    enabled: true
    module: agentic_scripts.workflows.oc_todo
    agent: oc-todo-resolver
  roadmap-dev:
    enabled: false          # flipped to true in a later task (the module lands later)
    module: agentic_scripts.workflows.roadmap_dev
    agent: planner-enhanced
    gate: idle              # quiet_window (default) or idle; idle = runs on every non-skipped fire,
                            # its drain decision comes from the session-based idle gate
